name: Neue Anforderung
description: Neue Funktionalität als Anforderung erfassen
title: "[Anforderung] "
body:
  - type: markdown
    attributes:
      value: |
        Aufbau: **Zielsystem + Priorität + Systemaktivität + allf. Ergänzungen + Funktionalität + Bedingungen**

        Beispiel: *Die Tagebbbuch-App muss dem Benutzer die Möglichkeit bieten, einen Eintrag mit einer Stimmung zu speichern, falls der Benutzer eingeschrieben ist.*

        Bitte die Issue danach manuell mit ihrem Typ etikettieren (Funktionale Anforderung, Qualitätsanforderung oder Randanforderung).
  - type: input
    id: zielsystem
    attributes:
      label: Zielsystem
      description: Das betroffene (Teil-)System
      placeholder: z.B. Die Tagebbbuch-App
    validations:
      required: true
  - type: dropdown
    id: prioritaet
    attributes:
      label: Priorität
      options:
        - muss (hohe Priorität)
        - soll (mittlere Priorität)
        - wird (niedrige Priorität)
    validations:
      required: true
  - type: dropdown
    id: systemaktivitaet
    attributes:
      label: Systemaktivität
      options:
        - "selbständig: (keine Ergänzung, das System handelt selbst)"
        - "Benutzerfunktion: dem Benutzer / Administrator die Möglichkeit bieten"
        - "Schnittstelle: fähig sein"
    validations:
      required: true
  - type: input
    id: ergaenzungen
    attributes:
      label: Allfällige Ergänzungen
      placeholder: z.B. über das Netzwerk
  - type: input
    id: funktionalitaet
    attributes:
      label: Funktionalität
      placeholder: z.B. einen Eintrag mit einer Stimmung zu speichern
    validations:
      required: true
  - type: input
    id: bedingungen
    attributes:
      label: Bedingungen
      description: Zeitliche Bedingungen mit "wenn", logische Bedingungen mit "falls"
      placeholder: z.B. falls der Benutzer eingeschrieben ist
  - type: textarea
    id: anforderung
    attributes:
      label: Anforderung als ganzer Satz
      placeholder: Die Tagebbbuch-App muss dem Benutzer die Möglichkeit bieten, ... zu ..., falls ...
    validations:
      required: true
